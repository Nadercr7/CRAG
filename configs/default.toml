# Verified RAG default configuration. Paths are relative to the repo root.

[paths]
data_dir = "data"
cache_db = "data/cache/llm.sqlite"
results_dir = "results"

[llm]
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
answer_model = "openai/gpt-oss-120b"
rewrite_model = "openai/gpt-oss-20b"
teacher_model = "openai/gpt-oss-120b"
judge_model = "qwen/qwen3.8-27b"
timeout_s = 60
max_retries = 5

# Groq free tier, per model. requests_per_day and tokens_per_minute are read from
# the x-ratelimit-* headers (2026-10-24); the daily request quota refills
# continuously (one request every 86.4 s). requests_per_minute and
# tokens_per_day are not in the headers: the values below are the published
# free-tier figures as reported by secondary sources, kept as a safe ceiling.
[llm.limits]
requests_per_day = 1000
requests_per_minute = 30
request_burst = 3
tokens_per_minute = 8000
tokens_per_day = 200000

[data]
beir_datasets = ["scifact", "nfcorpus", "fiqa"]
beir_split = "test"
hotpot_seed = 13
hotpot_test_size = 300
hotpot_dev_size = 200
slice_seed = 13

[retrieval]
embedder = "BAAI/bge-small-en-v1.5"
# query_prefix is unset on purpose: bge v1.5 gets its documented query instruction,
# other embedders get none. Set it to "" to force no prefix.
max_seq_length = 512
batch_size = 32
first_stage_k = 100   # per-retriever depth fed to RRF
rrf_k = 60
top_k = 20            # fused list handed to the verifier
eval_depth = 100
rerank_depth = 50     # hybrid candidates scored by a reranker
rerank_batch_size = 16
recall_ks = [20, 100]
ndcg_k = 10

# Placeholder thresholds: tune on the dev split once the verifier is calibrated.
[pipeline]
retrieve_k = 20        # fused list handed to the verifier
top_k_context = 5      # chunks kept per query before refinement
tau_hi = 0.7           # max chunk prob >= tau_hi -> "correct"
tau_lo = 0.2           # max chunk prob < tau_lo -> "incorrect"; also the chunk filter
tau_single = 0.5       # single threshold of arm G
tau_keep = 0.3         # keep a sentence when its prob >= tau_keep
max_sentences = 8      # cap on kept sentences across chunks
max_context_lines = 8  # hard cap on numbered lines sent to the generator
tau_abstain = 0.5      # abstain when sufficiency prob < tau_abstain
rewrite_queries = 2
rewrite_evidence = 3   # top kept sentences shown to the rewriter
rewrite_max_tokens = 512
answer_max_tokens = 256
